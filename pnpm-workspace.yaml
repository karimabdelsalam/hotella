packages:
  - apps/*
  - packages/platform/*
  - packages/domain/*
  - packages/contracts/*
  - packages/ui
  - tooling

# pnpm settings (pnpm 10 reads them from here; keeps npm from warning about unknown .npmrc keys)
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
saveExact: true
# Only packages listed here may run install scripts. Native compilation (node-gyp) is forbidden by ADR-0016;
# @swc/core's script only verifies its prebuilt binary.
onlyBuiltDependencies:
  - '@swc/core'
# sharp (images for vision models, BUILD_PLAN 9.5) loads its prebuilt N-API binary from @img/sharp-*; its install
# script would only fall back to compiling libvips, so it never runs.
ignoredBuiltDependencies:
  - sharp
