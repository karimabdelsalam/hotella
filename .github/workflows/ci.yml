name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: hotella
          POSTGRES_PASSWORD: hotella
          POSTGRES_DB: hotella
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hotella -d hotella" --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://hotella:hotella@localhost:5432/hotella
      VALKEY_URL: redis://localhost:6379
      # Integration tests use the service containers (Testcontainers starts only what is missing, e.g. the SeaweedFS S3 store).
      TEST_DATABASE_URL: postgresql://hotella:hotella@localhost:5432/hotella
      TEST_VALKEY_URL: redis://localhost:6379
      STORAGE_ACCESS_KEY: ci
      STORAGE_SECRET_KEY: ci-secret
      TURBO_TELEMETRY_DISABLED: '1'
      # The .NET hotel agent's build output: the cross-language link e2e (apps/pms-simulator) drives it.
      TEST_DOTNET_AGENT: ${{ github.workspace }}/apps/hotel-agent/artifacts/bin
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:selftest
      - run: pnpm depcruise
      - run: pnpm build
      - run: pnpm typecheck
      - name: Locale catalogs (en, ar, it, ru, de) — key parity, valid ICU, same arguments, CLDR plural forms
        run: pnpm locales:check
      - name: Hotel provisioning tool — profile validation and an idempotent run (pilot hotels, docs/pilot)
        run: node --test infra/docker/pilot/provision.test.mjs
      - name: Schema and migrations are in sync
        run: pnpm db:check
      - name: Migrations apply to a real PostgreSQL 18
        run: pnpm db:migrate
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/hotel-agent/global.json
      - name: Hotel agent (.NET 10 LTS) — analyzers as errors, unit tests and shared vectors
        # Build the whole solution (host and conformance driver too: `dotnet test` alone builds only test projects).
        run: |
          dotnet build apps/hotel-agent/Hotella.Agent.slnx -c Release
          dotnet test apps/hotel-agent/Hotella.Agent.slnx -c Release --no-build
      - name: Hotel agent packages (self-contained linux-x64 and win-x64) and a signed self-update round trip
        run: |
          apps/hotel-agent/packaging/publish.sh 0.10.1 linux-x64 "$RUNNER_TEMP/agent"
          apps/hotel-agent/packaging/publish.sh 0.10.2 linux-x64 "$RUNNER_TEMP/agent"
          apps/hotel-agent/packaging/publish.sh 0.10.2 win-x64 "$RUNNER_TEMP/agent"
          apps/hotel-agent/packaging/smoke-update.sh "$RUNNER_TEMP/agent"
      - run: pnpm test
      - name: Staff web in English (LTR) and Arabic (RTL) — Playwright, API mocked in the browser
        run: |
          pnpm --filter @hotella/staff-web exec playwright install --with-deps chromium
          pnpm --filter @hotella/staff-web e2e
          pnpm --filter @hotella/guest-web e2e
      - name: Keep Playwright failure context (page snapshots, error context)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/*/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Readiness against real PostgreSQL 18 + Valkey 9
        run: |
          node apps/api/dist/main.js & echo $! > api.pid
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/v1/ready && break; sleep 1; done
          curl -fsS localhost:3000/api/v1/ready | tee ready.json
          kill "$(cat api.pid)"
        env:
          NODE_ENV: test
          LOG_LEVEL: warn

  agent-msi:
    # ADR-0020: the hotel agent's MSI (WiX v5) is built from the win-x64 publish, installed and uninstalled on a real
    # Windows runner; an enrollment code given to it must reach neither the MSI log nor the disk.
    name: hotel agent MSI (WiX v5)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/hotel-agent/global.json
      - name: Build the MSI
        shell: pwsh
        run: apps/hotel-agent/packaging/windows/build-msi.ps1 -Version 0.10.2 -Out "$env:RUNNER_TEMP/msi"
      - name: Install, check, uninstall (and no enrollment code in the MSI log)
        shell: pwsh
        run: apps/hotel-agent/packaging/windows/smoke-msi.ps1 -Msi "$env:RUNNER_TEMP/msi/hotella-agent-0.10.2-win-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: hotella-agent-msi
          path: ${{ runner.temp }}/msi/
          retention-days: 14

  mobile:
    # ADR-0023: the Hotella staff app (Flutter). The Dart API client and the ARB strings are generated from the
    # OpenAPI document and /locales — CI fails when either is stale — then analyze and the widget tests (en, ar RTL,
    # it/ru/de).
    name: staff app (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      FLUTTER_VERSION: 3.47.6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # The generators use plain Node; there is no pnpm in this job to cache for.
          package-manager-cache: false
      - name: Generated client and strings are up to date
        run: |
          node tool/gen_client.mjs --check
          node tool/sync_arb.mjs --check
      - name: Flutter SDK (stable, pinned)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar -xJ
          echo "${{ runner.temp }}/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter pub get
      - name: Localizations generated from the ARB files are committed
        run: flutter gen-l10n && git diff --exit-code -- lib/l10n
      - run: flutter analyze
      - run: flutter test

  install:
    # The one-command Ubuntu installer (infra/install/install-ubuntu.sh) on a clean runner, in --local mode (no domain):
    # packages, the whole pilot stack, the first administrator and backup; then the API, both web apps and a sign-in.
    name: Ubuntu one-command install
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - name: Install
        env:
          HOTELLA_ADMIN_PASSWORD: install smoke passphrase 2026
        run: sudo -E bash infra/install/install-ubuntu.sh --local --email ci-admin@example.com --skip-checks
      - name: The installation answers
        run: |
          curl -fsS http://127.0.0.1:3000/api/v1/ready
          curl -fsS -o /dev/null http://127.0.0.1:3100/en/login
          curl -fsS -o /dev/null http://127.0.0.1:3200/en
          curl -fsS http://127.0.0.1:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"ci-admin@example.com","password":"install smoke passphrase 2026"}' | grep -q accessToken
          sudo hotella status
          test -f /etc/cron.d/hotella
      - name: Running it again changes nothing that works
        env:
          HOTELLA_ADMIN_PASSWORD: install smoke passphrase 2026
        run: |
          sudo -E bash infra/install/install-ubuntu.sh --local --email ci-admin@example.com --skip-checks
          curl -fsS http://127.0.0.1:3000/api/v1/ready
      - name: Logs on failure
        if: failure()
        run: sudo docker compose -p hotella-pilot -f /opt/hotella/infra/docker/compose.pilot.yml logs --tail=150

  pilot:
    # BUILD_PLAN §5.8 evidence: the on-prem pilot stack builds, boots with secrets from OpenBao, serves a signed-in
    # request as an ordinary (RLS-bound) database role, backs up with pgBackRest and passes a restore drill.
    name: pilot deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      HOTELLA_ADMIN_PASSWORD: pilot smoke passphrase 2026
    steps:
      - uses: actions/checkout@v5
      - name: Generate pilot credentials
        run: infra/docker/pilot/pilot.sh init
      - name: Build images and start infrastructure
        run: infra/docker/pilot/pilot.sh up
      - name: Initialise and configure OpenBao
        run: infra/docker/pilot/pilot.sh vault-init
      - name: Migrate as admin, grant the application role
        run: infra/docker/pilot/pilot.sh migrate
      - name: Start api, worker, agent gateway and staff web
        run: infra/docker/pilot/pilot.sh start
      - name: Create the first platform administrator, sign in and license the pilot tenant (Phase 11)
        run: |
          infra/docker/pilot/pilot.sh admin ops@planova.example Ops
          token=$(curl -fsS localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ops@planova.example\",\"password\":\"$HOTELLA_ADMIN_PASSWORD\"}" | jq -r .accessToken)
          curl -fsS localhost:3000/api/v1/me -H "authorization: Bearer $token" | jq -e '.user.isPlatformAdmin == true'
          curl -fsS localhost:3000/api/v1/tenants -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"code":"PILOT","name":"Pilot Hotels"}' | jq -e '.code == "PILOT"'
          infra/docker/pilot/license-pilot.sh "$token"
          curl -fsS localhost:3000/api/v1/public/branding?property=00000000-0000-7000-8000-000000000000 -o /dev/null -w '%{http_code}\n' | grep -q 404
      - name: A simulated hotel agent enrolls over mutual TLS and the worker projects its stay (Phase 2)
        run: |
          token=$(curl -fsS localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ops@planova.example\",\"password\":\"$HOTELLA_ADMIN_PASSWORD\"}" | jq -r .accessToken)
          infra/docker/pilot/smoke-agent.sh "$token"
      - name: A guest activates through the deployed stack and the realtime gateway answers (Phase 4)
        run: |
          token=$(curl -fsS localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ops@planova.example\",\"password\":\"$HOTELLA_ADMIN_PASSWORD\"}" | jq -r .accessToken)
          infra/docker/pilot/smoke-guest.sh "$token"
      - name: Entitlements refuse and grant; API clients and signed webhooks work through the deployed stack (Phase 11)
        run: |
          token=$(curl -fsS localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ops@planova.example\",\"password\":\"$HOTELLA_ADMIN_PASSWORD\"}" | jq -r .accessToken)
          infra/docker/pilot/smoke-developer.sh "$token"
      - name: A hotel is provisioned from its profile, and provisioning again changes nothing
        run: |
          token=$(curl -fsS localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ops@planova.example\",\"password\":\"$HOTELLA_ADMIN_PASSWORD\"}" | jq -r .accessToken)
          infra/docker/pilot/pilot.sh provision infra/docker/pilot/profiles/example.json "$token" | tee provision.log
          grep '^result ' provision.log | tail -1 | cut -c8- | jq -e '.counts.room.created == 12 and .counts.department.created == 3'
          infra/docker/pilot/pilot.sh provision infra/docker/pilot/profiles/example.json "$token" | tee again.log
          grep '^result ' again.log | tail -1 | cut -c8- | jq -e '[.counts[] | .created] | add == 0'
      - name: The application connects as an ordinary role bound by row-level security
        run: |
          docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml exec -T postgres \
            psql -U hotella_admin -d hotella -Atc "select rolsuper, rolbypassrls from pg_roles where rolname='hotella_app'" | grep -qx 'f|f'
          docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml exec -T postgres \
            psql -U hotella_admin -d hotella -Atc "select count(*) from pg_stat_activity where usename='hotella_app'" | grep -qv '^0$'
      - name: Backup (pgBackRest full) and restore drill
        run: |
          # The backup must hold every tenant the smokes created (PILOT, and UNLICENSED from the Phase 11 smoke).
          tenants=$(docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml exec -T postgres \
            psql -U hotella_admin -d hotella -Atc 'select count(*) from org.tenants')
          infra/docker/pilot/pilot.sh backup full
          infra/docker/pilot/pilot.sh restore-drill | tee drill.log
          grep -q 'restore-drill: OK' drill.log
          grep -A1 'restored-tenants:' drill.log | tail -1 | grep -qx "$tenants"
      - name: Logs on failure
        if: failure()
        run: docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml --profile tools down -v
