name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: hotella
          POSTGRES_PASSWORD: hotella
          POSTGRES_DB: hotella
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hotella -d hotella" --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://hotella:hotella@localhost:5432/hotella
      VALKEY_URL: redis://localhost:6379
      # Integration tests use the service containers (Testcontainers starts only what is missing, e.g. the SeaweedFS S3 store).
      TEST_DATABASE_URL: postgresql://hotella:hotella@localhost:5432/hotella
      TEST_VALKEY_URL: redis://localhost:6379
      STORAGE_ACCESS_KEY: ci
      STORAGE_SECRET_KEY: ci-secret
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:selftest
      - run: pnpm depcruise
      - run: pnpm build
      - run: pnpm typecheck
      - name: Locale catalogs have en/ar key parity and valid ICU
        run: pnpm locales:check
      - name: Schema and migrations are in sync
        run: pnpm db:check
      - name: Migrations apply to a real PostgreSQL 18
        run: pnpm db:migrate
      - run: pnpm test
      - name: Readiness against real PostgreSQL 18 + Valkey 9
        run: |
          node apps/api/dist/main.js & echo $! > api.pid
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/v1/ready && break; sleep 1; done
          curl -fsS localhost:3000/api/v1/ready | tee ready.json
          kill "$(cat api.pid)"
        env:
          NODE_ENV: test
          LOG_LEVEL: warn

  pilot:
    # BUILD_PLAN §5.8 evidence: the on-prem pilot stack builds, boots with secrets from OpenBao, serves a signed-in
    # request as an ordinary (RLS-bound) database role, backs up with pgBackRest and passes a restore drill.
    name: pilot deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      HOTELLA_ADMIN_PASSWORD: pilot smoke passphrase 2026
    steps:
      - uses: actions/checkout@v5
      - name: Generate pilot credentials
        run: infra/docker/pilot/pilot.sh init
      - name: Build images and start infrastructure
        run: infra/docker/pilot/pilot.sh up
      - name: Initialise and configure OpenBao
        run: infra/docker/pilot/pilot.sh vault-init
      - name: Migrate as admin, grant the application role
        run: infra/docker/pilot/pilot.sh migrate
      - name: Start api, worker and agent gateway
        run: infra/docker/pilot/pilot.sh start
      - name: Create the first platform administrator and sign in
        run: |
          infra/docker/pilot/pilot.sh admin ops@planova.example Ops
          token=$(curl -fsS localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ops@planova.example\",\"password\":\"$HOTELLA_ADMIN_PASSWORD\"}" | jq -r .accessToken)
          curl -fsS localhost:3000/api/v1/me -H "authorization: Bearer $token" | jq -e '.user.isPlatformAdmin == true'
          curl -fsS localhost:3000/api/v1/tenants -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"code":"PILOT","name":"Pilot Hotels"}' | jq -e '.code == "PILOT"'
          curl -fsS localhost:3000/api/v1/public/branding?property=00000000-0000-7000-8000-000000000000 -o /dev/null -w '%{http_code}\n' | grep -q 404
      - name: A simulated hotel agent enrolls over mutual TLS and the worker projects its stay (Phase 2)
        run: |
          token=$(curl -fsS localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"ops@planova.example\",\"password\":\"$HOTELLA_ADMIN_PASSWORD\"}" | jq -r .accessToken)
          infra/docker/pilot/smoke-agent.sh "$token"
      - name: The application connects as an ordinary role bound by row-level security
        run: |
          docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml exec -T postgres \
            psql -U hotella_admin -d hotella -Atc "select rolsuper, rolbypassrls from pg_roles where rolname='hotella_app'" | grep -qx 'f|f'
          docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml exec -T postgres \
            psql -U hotella_admin -d hotella -Atc "select count(*) from pg_stat_activity where usename='hotella_app'" | grep -qv '^0$'
      - name: Backup (pgBackRest full) and restore drill
        run: |
          infra/docker/pilot/pilot.sh backup full
          infra/docker/pilot/pilot.sh restore-drill | tee drill.log
          grep -q 'restore-drill: OK' drill.log
          grep -A1 'restored-tenants:' drill.log | tail -1 | grep -qx 1
      - name: Logs on failure
        if: failure()
        run: docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -p hotella-pilot -f infra/docker/compose.pilot.yml down -v
