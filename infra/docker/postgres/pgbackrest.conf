# pgBackRest for the pilot (ADR-0013). The repository is a dedicated volume; copy it off the host
# (runbook: docs/runbooks/backup-restore.md). Retention: 4 full backups and their WAL.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
start-fast=y
compress-type=zst
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[hotella]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=hotella_admin
