# Local development infrastructure (ADR-0013/0016). Mirrors production components.
# Start: pnpm dev:infra   Stop: pnpm dev:infra:down
name: hotella-dev
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: hotella
      POSTGRES_PASSWORD: hotella
      POSTGRES_DB: hotella
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotella -d hotella']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9
    command: ['valkey-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['valkeydata:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hotella
      MINIO_ROOT_PASSWORD: hotella-dev-only
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  otel:
    # All-in-one OpenTelemetry collector + Grafana + Tempo + Loki + Prometheus for local use.
    image: grafana/otel-lgtm:latest
    ports: ['3001:3000', '4317:4317', '4318:4318']

volumes:
  pgdata:
  valkeydata:
  miniodata:
