# Local development infrastructure (ADR-0013/0016). Mirrors production components.
# Start: pnpm dev:infra   Stop: pnpm dev:infra:down
name: hotella-dev
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: hotella
      POSTGRES_PASSWORD: hotella
      POSTGRES_DB: hotella
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotella -d hotella']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9
    command: ['valkey-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['valkeydata:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible object storage (ADR-0013). SeaweedFS replaced MinIO in Oct 2026: MinIO archived its
    # community edition and withdrew its images from Docker Hub and quay.io.
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ['8333:8333', '9333:9333']
    volumes:
      - 's3data:/data'
      - './seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9333/cluster/healthz']
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  otel:
    # All-in-one OpenTelemetry collector + Grafana + Tempo + Loki + Prometheus for local use.
    image: grafana/otel-lgtm:latest
    ports: ['3001:3000', '4317:4317', '4318:4318']

volumes:
  pgdata:
  valkeydata:
  s3data:
